<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Fabo 共享 · 支付结果</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F9}
a{color:#3B5BDB;text-decoration:none}a:hover{color:#2B48B8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #F4F6F9; color: #171A1F; font-family: Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 32px; background: #FFFFFF; box-shadow: 0 1px 0 #E6E9EE">
<img src="/_blob/761f36e4c12f8d6ad4e7c472db30e4eb" alt="" style="width: 26px; height: 26px; object-fit: contain">
<span style="font-size: 15px; font-weight: 600">Fabo 共享</span>
<div style="flex: 1"></div>
<span style="color: #4B5361">octo</span>
</header>

<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px">
<main role="status" style="width: 420px; max-width: 100%; box-sizing: border-box; padding: 36px 32px 28px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E9EE, 0 8px 24px rgba(16,24,40,0.06); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">

<sc-if value="{{paid}}" hint-placeholder-val="{{true}}">
<div style="width: 56px; height: 56px; border-radius: 50%; background: #DDF3E6; color: #17804A; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">已开通专业版</h1>
<span style="color: #4B5361">有效期至 2027-11-15，回到 Fabo 即可使用</span>
</div>
<a href="Account.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 9px; background: #F2F4F7; color: #171A1F; font-weight: 500">查看账户</a>
</sc-if>

<sc-if value="{{pending}}" hint-placeholder-val="{{false}}">
<div style="width: 56px; height: 56px; border-radius: 50%; background: #FBF0D9; color: #9A6700; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">正在确认付款</h1>
<span style="color: #4B5361">已付款的话稍等片刻，页面会自动更新</span>
</div>
</sc-if>

<sc-if value="{{closed}}" hint-placeholder-val="{{false}}">
<div style="width: 56px; height: 56px; border-radius: 50%; background: #F2F4F7; color: #646B78; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">订单已关闭</h1>
<span style="color: #4B5361">没有扣款</span>
</div>
<a href="Account.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 9px; background: {{accent}}; color: #FFFFFF; font-weight: 500">重新选择</a>
</sc-if>

</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3B5BDB","options":["#3B5BDB","#6B4FD8","#0B7F74","#1B7F45"]},"state":{"editor":"enum","options":["paid","pending","closed"],"default":"paid"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
// 三种结果：已开通、待确认（通知未到，自动轮询）、已关闭
const s = this.props.state ?? 'paid';
return { accent: this.props.accent ?? '#3B5BDB', paid: s === 'paid', pending: s === 'pending', closed: s === 'closed' };
}
}
</script>
</body>
</html>

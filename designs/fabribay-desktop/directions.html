<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FabriBay 桌面端 · 视觉方向</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="directions.css">
<style>html, body, #root { margin: 0; height: 100%; }</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="dir-data.jsx"></script>
<script type="text/babel" src="directions.jsx"></script>
<script type="text/babel">
  // Each direction is shown in its home theme first, then in the other one.
  const W = 1120, H = 720;
  ReactDOM.createRoot(document.getElementById('root')).render(
    <DesignCanvas>
      <DCSection id="directions" title="容器页 · 三个视觉方向" subtitle="同一份数据，各自的主场主题">
        <DCArtboard id="a" label="A · 船坞 — 原生、钴蓝、留白" width={W} height={H}><DirectionA theme="light" /></DCArtboard>
        <DCArtboard id="b" label="B · 调度台 — 深色、高密度、日志坞" width={W} height={H}><DirectionB theme="dark" /></DCArtboard>
        <DCArtboard id="c" label="C · 货单 — 页签 + 主从分栏、纸面墨色" width={W} height={H}><DirectionC theme="light" /></DCArtboard>
      </DCSection>
      <DCSection id="alt" title="另一套明暗" subtitle="每个方向都支持浅色与深色">
        <DCArtboard id="a2" label="A · 深色" width={W} height={H}><DirectionA theme="dark" /></DCArtboard>
        <DCArtboard id="b2" label="B · 浅色" width={W} height={H}><DirectionB theme="light" /></DCArtboard>
        <DCArtboard id="c2" label="C · 深色" width={W} height={H}><DirectionC theme="dark" /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
</script>
</body>
</html>

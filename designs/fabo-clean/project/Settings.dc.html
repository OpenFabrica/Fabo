<aside style="flex: 1 1 208px; box-sizing: border-box; padding: 18px 12px 14px; display: flex; flex-direction: column; gap: 20px">

<span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Fabo</span>
</div>
<nav aria-label="主导航" style="display: flex; flex-direction: column; gap: 2px">
<a class="fb-nav" href="Overview.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">

<a class="fb-nav" href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">

<span>镜像</span>

<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E9EE">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #1E9E5A; box-shadow: 0 0 0 3px #DDF3E6"></span>
<span style="font-weight: 500">引擎运行中</span>
<span style="margin-left: auto; font-size: 12px; color: #646B78">v0.4.0</span>
</div>
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #646B78"><span>内存</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace">2.7 / 8 GB</span></div>
<div style="height: 4px; border-radius: 4px; background: #EEF0F4"><div style="width: 34%; height: 4px; border-radius: 4px; background: {{accent}}"></div></div>
</div>
</div>
<a href="Settings.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; background: #FFFFFF; color: #171A1F; font-weight: 500; box-shadow: 0 0 0 1px #E6E9EE, 0 1px 2px rgba(16,24,40,0.05)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
<span>设置</span>
</a>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; margin: 8px 8px 8px 0; min-height: 884px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 1px #E6E9EE, 0 1px 3px rgba(16,24,40,0.04); display: flex; flex-wrap: wrap; align-content: flex-start">

<nav aria-label="设置分区" style="flex: 1 1 200px; box-sizing: border-box; padding: 22px 14px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #ECEEF2">
<h1 style="margin: 0 0 14px 10px; font-size: 22px; font-weight: 600; letter-spacing: -0.015em">设置</h1>
<sc-for list="{{sections}}" as="n" hint-placeholder-count="6">
<a class="fb-sub" href="{{n.href}}" style="display: flex; align-items: center; height: 34px; padding: 0 10px; border-radius: 8px; color: {{n.ink}}; background: {{n.bg}}; font-weight: {{n.weight}}">{{n.label}}</a>
</sc-for>
</nav>

<div style="flex: 999 1 480px; min-width: 0; box-sizing: border-box; padding: 26px 40px 40px; display: flex; flex-direction: column; gap: 36px; max-width: 820px">

<section id="general" aria-labelledby="general-h" style="display: flex; flex-direction: column; gap: 4px">
<h2 id="general-h" style="margin: 0 0 8px; font-size: 15px; font-weight: 600">通用</h2>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 16px; min-height: 52px; border-bottom: 1px solid #F0F2F5">
<span id="{{t.id}}" style="flex: 1">{{t.label}}</span>
<button type="button" role="switch" aria-checked="{{t.on}}" aria-labelledby="{{t.id}}" onClick="{{t.flip}}" style="position: relative; width: 38px; height: 22px; padding: 0; border: 0; border-radius: 22px; background: {{t.track}}; transition: background 0.15s">
<span style="position: absolute; top: 2px; left: {{t.knob}}; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.2); transition: left 0.15s"></span>
</button>
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 16px; min-height: 52px; border-bottom: 1px solid #F0F2F5">
<label for="lang" style="flex: 1">语言</label>
<select id="lang" style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: #F4F6F9; color: #171A1F">
<option>跟随系统</option>
<option selected>简体中文</option>
<option>English</option>
<option>日本語</option>
</select>
</div>
</section>

<section id="appearance" aria-labelledby="appearance-h" style="display: flex; flex-direction: column; gap: 18px">
<h2 id="appearance-h" style="margin: 0; font-size: 15px; font-weight: 600">外观</h2>
<div role="radiogroup" aria-label="主题" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="display: flex; flex-direction: column; gap: 10px; padding: 8px 8px 10px; border: 0; border-radius: 12px; background: #FFFFFF; color: #171A1F; text-align: left; box-shadow: {{t.ring}}">
<span style="display: flex; height: 76px; border-radius: 8px; overflow: hidden; background: {{t.shell}}">
<span style="width: 28%; display: flex; flex-direction: column; gap: 5px; padding: 10px 8px">
<span style="height: 5px; width: 70%; border-radius: 3px; background: {{t.bar}}"></span>
<span style="height: 5px; width: 90%; border-radius: 3px; background: {{t.bar}}"></span>
<span style="height: 5px; width: 60%; border-radius: 3px; background: {{t.bar}}"></span>
</span>
<span style="flex: 1; margin: 6px 6px 6px 0; border-radius: 6px; background: {{t.card}}; display: flex; flex-direction: column; gap: 6px; padding: 10px">
<span style="height: 6px; width: 40%; border-radius: 3px; background: {{accent}}"></span>
<span style="height: 5px; width: 85%; border-radius: 3px; background: {{t.bar}}"></span>
<span style="height: 5px; width: 65%; border-radius: 3px; background: {{t.bar}}"></span>
</span>
</span>
<span style="padding-left: 4px; font-weight: 500">{{t.label}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 16px; min-height: 52px; border-bottom: 1px solid #F0F2F5">
<span style="flex: 1">强调色</span>
<div role="radiogroup" aria-label="强调色" style="display: flex; gap: 10px">
<sc-for list="{{swatches}}" as="w" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{w.on}}" aria-label="{{w.label}}" onClick="{{w.pick}}" style="width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: {{w.hex}}; box-shadow: {{w.ring}}"></button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px; min-height: 52px; border-bottom: 1px solid #F0F2F5">
<span style="flex: 1">列表密度</span>
<div role="group" aria-label="列表密度" style="display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: #F4F6F9">
<sc-for list="{{density}}" as="d" hint-placeholder-count="2">
<button type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="height: 26px; padding: 0 12px; border: 0; border-radius: 6px; background: {{d.bg}}; color: {{d.ink}}; font-size: 12px; font-weight: 500; box-shadow: {{d.shadow}}">{{d.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px; min-height: 52px; border-bottom: 1px solid #F0F2F5">
<label for="scale" style="flex: 1">文字大小</label>
<input id="scale" type="range" min="90" max="130" step="5" value="{{scale}}" onChange="{{onScale}}" style="width: 200px; accent-color: {{accent}}">
<span style="width: 44px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #4B5361">{{scaleLabel}}</span>
</div>
</section>

<section id="resources" aria-labelledby="resources-h" style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; margin-bottom: 8px">
<h2 id="resources-h" style="margin: 0; flex: 1; font-size: 15px; font-weight: 600">资源</h2>
<span style="font-size: 12px; color: #646B78">修改后需重启引擎</span>
</div>
<sc-for list="{{limits}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 16px; min-height: 52px; border-bottom: 1px solid #F0F2F5">
<label for="{{r.id}}" style="flex: 1">{{r.label}}</label>
<input id="{{r.id}}" type="range" min="{{r.min}}" max="{{r.max}}" step="{{r.step}}" value="{{r.value}}" onChange="{{r.set}}" style="width: 200px; accent-color: {{accent}}">
<span style="width: 64px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #4B5361">{{r.text}}</span>
</div>
</sc-for>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 16px">
<button type="button" style="height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: #F4F6F9; color: #171A1F; font-weight: 500">还原</button>
<button type="button" style="height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: {{accent}}; color: #FFFFFF; font-weight: 500">应用并重启</button>
</div>
</section>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3B5BDB","options":["#3B5BDB","#0B7F74","#6B4FD8","#C2410C"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      pick: '', theme: 'light', density: 'cozy', scale: 100,
      toggles: { login: true, window: false, update: true },
      cpu: 4, mem: 8, disk: 64
    };
  }
  renderVals() {
    const s = this.state;
    // 在页面里点选强调色时覆盖 Tweaks 中的值，直接预览效果
    const accent = s.pick || (this.props.accent ?? '#3B5BDB');
    const sections = [['#general', '通用'], ['#appearance', '外观'], ['#resources', '资源'], ['#registries', '镜像仓库'], ['#kubernetes', 'Kubernetes'], ['#engine', '引擎']]
      .map(([href, label], i) => ({ href, label, bg: i === 1 ? '#F4F6F9' : 'transparent', ink: i === 1 ? '#171A1F' : '#4B5361', weight: i === 1 ? 500 : 400 }));
    const toggles = [['login', '登录时启动 Fabo'], ['window', '启动时打开主窗口'], ['update', '自动检查更新']].map(([id, label]) => {
      const on = !!s.toggles[id];
      return {
        id: 'tg-' + id, label, on: on ? 'true' : 'false',
        track: on ? accent : '#D5D9E0', knob: on ? '18px' : '2px',
        flip: () => this.setState({ toggles: { ...s.toggles, [id]: !on } })
      };
    });
    const themes = [
      { id: 'system', label: '跟随系统', shell: 'linear-gradient(90deg, #F4F6F9 50%, #14171C 50%)', card: '#FFFFFF', bar: '#D5D9E0' },
      { id: 'light', label: '浅色', shell: '#F4F6F9', card: '#FFFFFF', bar: '#E2E5EA' },
      { id: 'dark', label: '深色', shell: '#0F1216', card: '#181C22', bar: '#2A3039' }
    ].map((t) => ({
      ...t, on: s.theme === t.id ? 'true' : 'false',
      ring: s.theme === t.id ? '0 0 0 2px ' + accent : '0 0 0 1px #E6E9EE',
      pick: () => this.setState({ theme: t.id })
    }));
    const swatches = [['#3B5BDB', '靛蓝'], ['#0B7F74', '青绿'], ['#6B4FD8', '紫色'], ['#C71F6C', '粉色'], ['#C2410C', '橙色']].map(([hex, label]) => ({
      hex, label, on: accent === hex ? 'true' : 'false',
      ring: accent === hex ? '0 0 0 2px #FFFFFF, 0 0 0 4px ' + hex : 'none',
      pick: () => this.setState({ pick: hex })
    }));
    const density = [['compact', '紧凑'], ['cozy', '舒适']].map(([id, label]) => ({
      label, on: s.density === id ? 'true' : 'false',
      bg: s.density === id ? '#FFFFFF' : 'transparent', ink: s.density === id ? '#171A1F' : '#4B5361',
      shadow: s.density === id ? '0 0 0 1px #E2E5EA' : 'none',
      pick: () => this.setState({ density: id })
    }));
    const limits = [
      { id: 'cpu', label: 'CPU', min: 1, max: 10, step: 1, value: s.cpu, text: s.cpu + ' 核' },
      { id: 'mem', label: '内存', min: 2, max: 32, step: 1, value: s.mem, text: s.mem + ' GB' },
      { id: 'disk', label: '磁盘上限', min: 16, max: 256, step: 16, value: s.disk, text: s.disk + ' GB' }
    ].map((r) => ({ ...r, set: (e) => this.setState({ [r.id]: Number(e.target.value) }) }));
    return {
      accent, sections, toggles, themes, swatches, density, limits,
      scale: s.scale, scaleLabel: s.scale + '%',
      onScale: (e) => this.setState({ scale: Number(e.target.value) })
    };
  }
}
</script>
</body>
</html>

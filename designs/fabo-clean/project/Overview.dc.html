<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Fabo · 概览</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F9}
a{color:#3B5BDB;text-decoration:none}a:hover{color:#2B48B8}
button{font:inherit;cursor:pointer}
.fb-nav:hover{background:#ECEFF3}
.fb-tile:hover{box-shadow:0 0 0 1px #D9DDE4,0 2px 6px rgba(16,24,40,0.05)}

</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #F4F6F9; color: #171A1F; font-family: Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 13px; line-height: 1.45">

<aside style="flex: 1 1 208px; box-sizing: border-box; padding: 18px 12px 14px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<img src="/_blob/761f36e4c12f8d6ad4e7c472db30e4eb" alt="Fabo" style="width: 28px; height: 28px; object-fit: contain">
<span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Fabo</span>
</div>
<nav aria-label="主导航" style="display: flex; flex-direction: column; gap: 2px">
<a href="Overview.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; background: #FFFFFF; color: #171A1F; font-weight: 500; box-shadow: 0 0 0 1px #E6E9EE, 0 1px 2px rgba(16,24,40,0.05)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
<span>概览</span>

<a class="fb-nav" href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4.5 7.5 12 12l8-4.5M12 12v9"/></svg>
<span style="flex: 1">容器</span>
<span style="font-size: 12px; color: #646B78">11</span>
</a>
<a class="fb-nav" href="Images.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>

</a>
<a class="fb-nav" href="#volumes" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13"/><path d="M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></svg>
<span>卷</span>
</a>
<a class="fb-nav" href="#networks" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-2.5h12V16"/></svg>
<span>网络</span>
</a>
<a class="fb-nav" href="#builds" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 9-9"/><path d="M12.5 4.5h4l3 3-3.5 3.5-5-5z"/></svg>
<span>构建</span>
</a>
<a class="fb-nav" href="#kubernetes" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 3v7M12 14v7M3 12h7M14 12h7"/></svg>
<span>Kubernetes</span>
</a>
<a class="fb-nav" href="#terminal" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15H17"/></svg>
<span>终端</span>
</a>
</nav>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E9EE">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #1E9E5A; box-shadow: 0 0 0 3px #DDF3E6"></span>
<span style="font-weight: 500">引擎运行中</span>
<span style="margin-left: auto; font-size: 12px; color: #646B78">v0.4.0</span>
</div>
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #646B78"><span>内存</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace">2.7 / 8 GB</span></div>
<div style="height: 4px; border-radius: 4px; background: #EEF0F4"><div style="width: 34%; height: 4px; border-radius: 4px; background: {{accent}}"></div></div>
</div>
</div>
<a class="fb-nav" href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4B5361">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
<span>设置</span>
</a>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; margin: 8px 8px 8px 0; min-height: 884px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 1px #E6E9EE, 0 1px 3px rgba(16,24,40,0.04); display: flex; flex-direction: column; gap: 24px; padding: 22px 28px 28px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<h1 style="margin: 0; flex: 1 1 200px; font-size: 22px; font-weight: 600; letter-spacing: -0.015em">下午好</h1>
<button type="button" class="fb-ghost" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: #F4F6F9; color: #171A1F; font-weight: 500">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
<span>拉取镜像</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: {{accent}}; color: #FFFFFF; font-weight: 500; box-shadow: 0 1px 2px rgba(16,24,40,0.12)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<span>运行容器</span>
</button>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<a class="fb-tile" href="{{t.href}}" style="display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; border-radius: 12px; background: #FFFFFF; color: #171A1F; box-shadow: 0 0 0 1px #E6E9EE">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="color: #4B5361">{{t.label}}</span>
<span style="width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: {{accentTint}}; color: {{accent}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>
</span>
</div>
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em">{{t.value}}</span>
<span style="color: #646B78">{{t.unit}}</span>
</div>
</a>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 14px">
<section aria-labelledby="usage-h" style="flex: 2 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px; border-radius: 12px; box-shadow: 0 0 0 1px #E6E9EE">
<div style="display: flex; align-items: center; gap: 12px">
<h2 id="usage-h" style="margin: 0; flex: 1; font-size: 15px; font-weight: 600">资源占用</h2>
<div role="group" aria-label="时间范围" style="display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: #F4F6F9">
<button type="button" aria-pressed="false" style="height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #4B5361; font-size: 12px">15 分钟</button>
<button type="button" aria-pressed="true" style="height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: #FFFFFF; color: #171A1F; font-size: 12px; font-weight: 500; box-shadow: 0 0 0 1px #E2E5EA">1 小时</button>
<button type="button" aria-pressed="false" style="height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #4B5361; font-size: 12px">24 小时</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="color: #4B5361">CPU</span><span style="font-size: 20px; font-weight: 600">21%</span><span style="font-size: 12px; color: #646B78">4 核</span></div>
<div style="display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-bottom: 1px; border-bottom: 1px solid #ECEEF2">
<sc-for list="{{cpu}}" as="b" hint-placeholder-count="40"><span style="flex: 1; height: {{b.h}}; border-radius: 3px 3px 0 0; background: {{accent}}; opacity: {{b.o}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #646B78"><span>60 分钟前</span><span>现在</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="color: #4B5361">内存</span><span style="font-size: 20px; font-weight: 600">2.7 GB</span><span style="font-size: 12px; color: #646B78">共 8 GB</span></div>
<div style="display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-bottom: 1px; border-bottom: 1px solid #ECEEF2">
<sc-for list="{{mem}}" as="b" hint-placeholder-count="40"><span style="flex: 1; height: {{b.h}}; border-radius: 3px 3px 0 0; background: #1E9E5A; opacity: {{b.o}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #646B78"><span>60 分钟前</span><span>现在</span></div>
</div>
</div>
</section>

<section aria-labelledby="disk-h" style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px; border-radius: 12px; box-shadow: 0 0 0 1px #E6E9EE">
<div style="display: flex; align-items: center">
<h2 id="disk-h" style="margin: 0; flex: 1; font-size: 15px; font-weight: 600">磁盘</h2>
<button type="button" class="fb-ghost" style="height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: #F4F6F9; color: #171A1F; font-weight: 500">清理</button>
</div>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em">9.4 GB</span><span style="color: #646B78">可回收 2.1 GB</span></div>
<div style="display: flex; gap: 3px; height: 10px">
<sc-for list="{{disk}}" as="d" hint-placeholder-count="4"><span style="flex: {{d.flex}}; border-radius: 3px; background: {{d.color}}"></span></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{disk}}" as="d" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 10px; height: 10px; border-radius: 3px; background: {{d.color}}"></span>
<span style="flex: 1; color: #4B5361">{{d.label}}</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px">{{d.size}}</span>
</div>
</sc-for>
</div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 14px">
<section aria-labelledby="busy-h" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 12px; box-shadow: 0 0 0 1px #E6E9EE">
<div style="display: flex; align-items: center; margin-bottom: 6px">
<h2 id="busy-h" style="margin: 0; flex: 1; font-size: 15px; font-weight: 600">最忙的容器</h2>
<a href="Main.dc.html" style="font-size: 12px; font-weight: 500">全部容器</a>
</div>
<sc-for list="{{busy}}" as="b" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 140px 56px; align-items: center; gap: 14px; height: 36px">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="width: 7px; height: 7px; border-radius: 50%; background: #1E9E5A"></span><span style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.name}}</span></div>
<div style="height: 6px; border-radius: 6px; background: #EEF0F4"><div style="width: {{b.w}}; height: 6px; border-radius: 6px; background: {{accent}}"></div></div>
<span style="text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #4B5361">{{b.cpu}}</span>
</div>
</sc-for>
</section>

<section aria-labelledby="events-h" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 12px; box-shadow: 0 0 0 1px #E6E9EE">
<h2 id="events-h" style="margin: 0 0 6px; font-size: 15px; font-weight: 600">最近事件</h2>
<sc-for list="{{events}}" as="e" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; height: 36px">
<span style="width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: {{e.bg}}; color: {{e.ink}}">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.icon}}"/></svg>
</span>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><span style="font-weight: 500">{{e.name}}</span><span style="color: #4B5361"> {{e.what}}</span></span>
<span style="font-size: 12px; color: #646B78">{{e.when}}</span>
</div>
</sc-for>
</section>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3B5BDB","options":["#3B5BDB","#0B7F74","#6B4FD8","#C2410C"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3B5BDB';
    // 平滑的伪随机曲线，生成柱状图高度
    const series = (k, base, amp) => Array.from({ length: 40 }, (_, i) => {
      const v = base + amp * (Math.sin(i * 0.35 + k) * 0.6 + Math.sin(i * 1.1 + k * 2) * 0.4);
      return { h: Math.round(Math.max(0.06, Math.min(1, v)) * 118) + 'px', o: (0.3 + (i / 40) * 0.7).toFixed(2) };
    });
    const tiles = [
      { label: '容器', value: '8', unit: '/ 11 运行中', href: 'Main.dc.html', icon: 'M12 3 20 7.5v9L12 21l-8-4.5v-9z M4.5 7.5 12 12l8-4.5M12 12v9' },
      { label: '镜像', value: '24', unit: '6.1 GB', href: 'Images.dc.html', icon: 'm12 3 9 5-9 5-9-5z m-9 10 9 5 9-5' },
      { label: '卷', value: '9', unit: '1.8 GB', href: '#volumes', icon: 'M4.5 5.5c0-1.4 3.4-2.5 7.5-2.5s7.5 1.1 7.5 2.5-3.4 2.5-7.5 2.5-7.5-1.1-7.5-2.5z M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13' },
      { label: '网络', value: '5', unit: '3 个自定义', href: '#networks', icon: 'M9 3h6v5H9z M3 16h6v5H3z M15 16h6v5h-6z M12 8v4M6 16v-2.5h12V16' }
    ];
    const disk = [
      { label: '镜像', size: '6.1 GB', flex: 61, color: accent },
      { label: '卷', size: '1.8 GB', flex: 18, color: '#1E9E5A' },
      { label: '构建缓存', size: '1.2 GB', flex: 12, color: '#E0A526' },
      { label: '容器', size: '0.3 GB', flex: 4, color: '#A3A9B4' }
    ];
    const busy = [['shop-api-1', 14.3], ['prometheus', 3.3], ['shop-db-1', 1.9], ['minio', 0.9], ['grafana', 0.7]]
      .map(([name, v]) => ({ name, cpu: v + '%', w: Math.max(3, Math.round(v / 16 * 100)) + '%' }));
    const ok = { bg: '#DDF3E6', ink: '#17804A' };
    const bad = { bg: '#FCE4E2', ink: '#C2352C' };
    const info = { bg: '#EEF0F4', ink: '#4B5361' };
    const play = 'M8 5.5v13l10.5-6.5z';
    const x = 'M6 6l12 12M18 6 6 18';
    const down = 'M12 4v11M7 10l5 5 5-5';
    const events = [
      { name: 'shop-api-1', what: '已重启', when: '4 分钟前', icon: play, ...ok },
      { name: 'loki', what: '异常退出，代码 1', when: '6 分钟前', icon: x, ...bad },
      { name: 'postgres:17', what: '已拉取', when: '1 小时前', icon: down, ...info },
      { name: 'grafana', what: '已启动', when: '2 小时前', icon: play, ...ok },
      { name: 'db-migrate', what: '正常退出', when: '2 天前', icon: 'M5 12.5l4.5 4.5L19 7.5', ...info }
    ];
    return {
      accent, accentTint: accent + '14',
      tiles, disk, busy, events,
      cpu: series(1, 0.32, 0.22), mem: series(3, 0.5, 0.08)
    };
  }
}
</script>
</body>
</html>

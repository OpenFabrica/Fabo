<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><title>Fabo · 本地开发，从容有序</title><style>body{margin:0}*{box-sizing:border-box}.piece{font-family:-apple-system,'PingFang SC',sans-serif;color:#182932;width:1920px;height:1080px;background:#f4f7f8;position:relative}.eyebrow{font-size:24px;letter-spacing:5px;color:#42716c}.title{font-size:90px;letter-spacing:-4px;line-height:1.24;font-weight:650;margin:26px 0}.sub{font-size:31px;color:#62727a;line-height:1.7}.screen{border-radius:20px;box-shadow:0 30px 90px #163e4026;border:1px solid #dce5e8}.capture [data-om-starter]>div:last-child{display:none!important}.capture svg[data-om-exportable-video-with-duration-secs]{transform:none!important;box-shadow:none!important}.capture [data-om-starter]{background:#f4f7f8!important}</style><div id="root"></div>
<script src="vendor/react.js"></script><script src="vendor/react-dom.js"></script><script src="vendor/babel.js"></script>
<script>window.OM_SCENES = '[{"name":"Opening","dur":4,"desc":"品牌与主题登场"},{"name":"Containers","dur":6,"desc":"展示完整容器管理界面"},{"name":"Compose","dur":4,"desc":"推近 Compose 项目分组"},{"name":"Workflow","dur":10,"desc":"展示 Docker CLI、Compose 和 Buildx 工作流"},{"name":"Closing","dur":6,"desc":"品牌与产品定位收尾"}]';window.OM_PLAYBACK = '{"mode":"times","count":1}';const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"motionEditor":true}/*EDITMODE-END*/;if(location.search.includes('capture'))document.documentElement.classList.add('capture');</script>
<script type="text/babel" src="vendor/animations-v3.jsx"></script><script type="text/babel" src="vendor/tweaks-panel.jsx"></script><script type="text/babel">
const MOTION={enter:(t,a,d=1)=>Easing.easeOutCubic(Math.max(0,Math.min(1,(t-a)/d))),draw:(t,a,d)=>Math.max(0,Math.min(1,(t-a)/d)),pop:(t,a,d=1)=>Easing.easeInOutCubic(Math.max(0,Math.min(1,(t-a)/d)))};
function Piece(){const {T,CUES}=useComposition();const tl=useTimeline();React.useEffect(()=>{window.__animStage={duration:30,setTime:tl.setTime,setPlaying:tl.setPlaying}},[tl]);const enter=(a)=>({opacity:MOTION.enter(T,a),transform:`translateY(${32*(1-MOTION.enter(T,a))}px)`});return <div className="piece">
<div style={{position:'absolute',left:96,top:62,display:'flex',gap:16,alignItems:'center',fontSize:30,fontWeight:650}}><img src="assets/logo.png" width="46"/>Fabo</div><div style={{position:'absolute',right:96,top:74,fontSize:19,letterSpacing:3,color:'#72838a'}}>OPENFABRICA</div>
<Shot from={CUES.Opening} to={CUES.Containers}><div style={{position:'absolute',left:150,top:300,...enter(CUES.Opening)}}><div className="eyebrow">为本地开发而来</div><h1 className="title">容器有序。<br/>开发从容。</h1><div className="sub">你的 macOS 本地容器工作台</div></div><img src="assets/logo.png" style={{position:'absolute',width:470,right:210,top:285,opacity:MOTION.enter(T,.35),transform:`scale(${.85+.15*MOTION.pop(T,.35,2)})`}}/></Shot>
<Shot from={CUES.Containers} to={CUES.Workflow}><div style={{position:'absolute',left:112,top:170,...enter(CUES.Containers)}}><div className="eyebrow">看得清，管得顺</div><h1 className="title" style={{fontSize:58,marginTop:16}}>{T<CUES.Compose?'容器状态，一目了然。':'一个项目，一处掌握。'}</h1></div><img className="screen" src="assets/fabo-window.png" style={{position:'absolute',width:1320,left:300,top:345,transformOrigin:'40% 20%',transform:`translateY(${45*(1-MOTION.enter(T,CUES.Containers))}px) scale(${.94+.06*MOTION.enter(T,CUES.Containers)+.2*MOTION.pop(T,CUES.Compose,3)})`,opacity:MOTION.enter(T,CUES.Containers)}}/></Shot>
<Shot from={CUES.Workflow} to={CUES.Closing}><div style={{position:'absolute',left:130,top:275,...enter(CUES.Workflow)}}><div className="eyebrow">延续熟悉的工作方式</div><h1 className="title" style={{fontSize:76}}>命令照常。<br/>工作流继续。</h1><div className="sub">Docker CLI · Compose · Buildx</div></div><div style={{position:'absolute',left:970,top:245,width:810,height:560,background:'#fff',border:'1px solid #dce5e8',borderRadius:22,padding:42,boxShadow:'0 25px 70px #163e4012',...enter(CUES.Workflow+.3)}}><div style={{display:'flex',gap:10,marginBottom:64}}>{['#ed887b','#e6c46c','#79b89c'].map(c=><i key={c} style={{width:14,height:14,borderRadius:20,background:c}}/>)}</div>{['fabo ps','fabo compose up -d','fabo buildx build .'].map((s,i)=><div key={s} style={{fontFamily:'Menlo,monospace',fontSize:29,marginBottom:42,opacity:MOTION.enter(T,CUES.Workflow+.7+i*2)}}><span style={{color:'#008e77'}}>$ </span>{s.slice(0,Math.ceil(s.length*MOTION.draw(T,CUES.Workflow+.7+i*2,1.1)))}</div>)}</div></Shot>
<Shot from={CUES.Closing} to={31}><div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',...enter(CUES.Closing)}}><img src="assets/logo.png" width="165"/><h1 className="title" style={{fontSize:104,margin:'18px 0'}}>Fabo</h1><div style={{fontSize:50,fontWeight:550}}>本地开发，从容有序。</div><div className="sub" style={{marginTop:28}}>macOS 本地容器引擎与桌面管理工具</div></div></Shot>
<div style={{position:'absolute',left:96,right:96,bottom:48,height:3,background:'#e1e9eb'}}><div style={{height:3,width:`${T/30*100}%`,background:'#00a98e'}}/></div></div>}
function App(){const[t,set]=useTweaks(TWEAK_DEFAULTS);return <><CompositionStage width={1920} height={1080} scenes={window.OM_SCENES} playback={window.OM_PLAYBACK}><Piece/></CompositionStage>{!location.search.includes('capture')&&<TweaksPanel><TweakToggle label="Motion editor" value={t.motionEditor} onChange={v=>set('motionEditor',v)}/></TweaksPanel>}</>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></html>

# Fabo Linux: the small WSL2 distro Fabo's engine runs in on Windows
# (Alpine and the static fabo binaries; made by scripts/fabo-linux.sh,
# which scripts/windows-bundle.sh runs).
# Setup and fabo-win start the engine explicitly after the distro is ready.
[boot]
systemd = false

[user]
default = root

[interop]
# Nothing in here needs to start Windows programs: with interop off, a
# process that somehow became root in this distro still cannot run one.
enabled = false
appendWindowsPath = false
